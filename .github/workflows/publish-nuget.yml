name: Publish to NuGet

# Runs when a GitHub Release is published. The package version is taken from the
# release tag (e.g. tag "v1.0.0" -> package 1.0.0), so the NuGet version always
# matches the release and the two can never drift.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive version from tag
        id: version
        # GITHUB_REF_NAME is the tag (e.g. "v1.0.0"); strip a leading "v".
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        # Pack every packable library under src/ (core + all companion packages).
        # SetNet.StateSync.Unity has no .csproj (it's a UPM source package) so it is skipped automatically.
        run: |
          for proj in $(find src -name '*.csproj' | sort); do
            echo "::group::pack $proj"
            dotnet pack "$proj" -c Release -p:Version=${{ steps.version.outputs.value }} -o ./artifacts
            echo "::endgroup::"
          done

      - name: Push to NuGet
        # Push every produced package; --skip-duplicate makes re-runs idempotent.
        # Requires the NUGET_API_KEY repository secret. Push order is irrelevant (packages are independent).
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
