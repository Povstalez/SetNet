name: Publish to GitHub Packages

# Publishes every SetNet package to this repository's GitHub Packages NuGet feed.
#
# Each package's version is the <Version> in its own .csproj — NOT the release tag — so an
# untouched package keeps its last released number and --skip-duplicate makes the push a no-op
# for it. Bump <Version>/<AssemblyVersion>/<FileVersion> only in the projects you changed.
#
# Runs when a GitHub Release is published. The manual trigger takes an OPTIONAL version that
# overrides every csproj (escape hatch for one-off builds, e.g. a "1.2.0-preview1" feed drop).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override for ALL packages (e.g. 1.2.0-preview1). Leave empty to use each csproj <Version>.'
        required: false

# GITHUB_TOKEN needs write access to Packages; no personal access token required.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        # Pack every packable library under src/ (core + all companion packages). Without an
        # override each project packs at its own <Version>; the UPM source packages under
        # src/engine have no .csproj and are skipped automatically.
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          args=""
          if [ -n "$VERSION_OVERRIDE" ]; then
            echo "Overriding every package version with $VERSION_OVERRIDE"
            args="-p:Version=$VERSION_OVERRIDE"
          fi
          for proj in $(find src -name '*.csproj' | sort); do
            echo "::group::pack $proj"
            dotnet pack "$proj" -c Release $args -o ./artifacts
            echo "::endgroup::"
          done

      - name: Push to GitHub Packages
        # The feed is scoped to the repository owner. --skip-duplicate makes re-runs idempotent
        # (GitHub Packages does not allow overwriting an existing version) and silently skips
        # the packages that were not bumped since the previous release.
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --skip-duplicate
          done
